---
- name: Deploy Family Expense Tracker Application
  hosts: production
  become: yes
  vars:
    app_dir: /opt/expense-tracker
    docker_compose_version: "2.23.0"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - git
          - ufw
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Configure UFW firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow SSH through firewall
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through firewall
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow Backend API through firewall
      ufw:
        rule: allow
        port: "5000"
        proto: tcp

    - name: Allow Grafana through firewall
      ufw:
        rule: allow
        port: "3001"
        proto: tcp

    - name: Allow Prometheus through firewall
      ufw:
        rule: allow
        port: "9090"
        proto: tcp

    - name: Allow Node Exporter through firewall
      ufw:
        rule: allow
        port: "9100"
        proto: tcp

    - name: Create monitoring directory
      file:
        path: "{{ app_dir }}/monitoring"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Create Prometheus config directory
      file:
        path: "{{ app_dir }}/monitoring/prometheus"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Create Grafana config directory
      file:
        path: "{{ app_dir }}/monitoring/grafana"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
